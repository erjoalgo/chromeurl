[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chromeurl"
version = "2026.11.9.0"
dependencies = [
  "ConfigArgParse",
  "requests"
]
requires-python = ">=3.11"
authors = [
  {name = "Ernesto Alfonso", email = "erjoalgo@gmail.com"},
]
maintainers = [
  {name = "Ernesto Alfonso", email = "erjoalgo@gmail.com"},
]
description = "Native messaging host for the Chrome Current URL extension: serves the current tab's url over a local HTTP endpoint"


readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["chromium", "chrome", "url", "native"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/erjoalgo/chromeurl"
Documentation = "https://github.com/erjoalgo/chromeurl"
Repository = "https://github.com/erjoalgo/chromeurl"
"Bug Tracker" = "https://github.com/erjoalgo/chromeurl/issues"

[project.scripts]
chromeurl = "chromeurl.main:main"

[project.entry-points."chromeurl.main"]
chromeurl = "chromeurl.main:main"

[tool.mypy]
strict = true
files = ["chromeurl"]

[[tool.mypy.overrides]]
module = ["configargparse"]
ignore_missing_imports = true
